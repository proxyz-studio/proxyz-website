name: Smoke deploy

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 min
  workflow_dispatch:
  repository_dispatch:
    types: [vercel.deployment.success]

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe homepage
        run: |
          set -euo pipefail
          URL="https://proxyz.studio"
          HTTP=$(curl -s -o /tmp/body.html -w "%{http_code}" --max-time 30 "$URL")
          if [ "$HTTP" != "200" ]; then
            echo "::error::Homepage returned HTTP $HTTP"
            exit 1
          fi
          BYTES=$(wc -c < /tmp/body.html)
          if [ "$BYTES" -lt 500 ]; then
            echo "::error::Homepage body suspiciously short ($BYTES bytes)"
            exit 1
          fi
          if ! grep -q "PROXYZ" /tmp/body.html; then
            echo "::error::Homepage missing PROXYZ wordmark"
            exit 1
          fi
          if ! grep -q "<h1" /tmp/body.html; then
            echo "::error::Homepage missing its h1 heading"
            exit 1
          fi
          echo "OK: $URL is up, body $BYTES bytes, PROXYZ wordmark and h1 present"

      - name: Probe hosted signature image
        run: |
          set -euo pipefail
          URL="https://proxyz.studio/proxyz-lockup-e-horizontal-light-tight.png"
          RESULT=$(curl -s -o /dev/null -w "%{http_code} %{content_type}" --max-time 30 "$URL")
          HTTP="${RESULT%% *}"
          TYPE="${RESULT#* }"
          if [ "$HTTP" != "200" ]; then
            echo "::error::Signature image returned HTTP $HTTP"
            exit 1
          fi
          case "$TYPE" in
            image/png*) ;;
            *)
              echo "::error::Signature image has content type '$TYPE', expected image/png"
              exit 1
              ;;
          esac
          echo "OK: $URL is up, $TYPE"
